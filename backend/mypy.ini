[mypy]
python_version = 3.12
pretty = True
show_error_codes = True
warn_unused_ignores = True

# Deliberately scope the strict backend mypy gate to the release-hardening
# surfaces that are currently maintained and expected to stay green. This keeps
# RUN_MYPY=1 meaningful for mission-touched infrastructure code without letting
# unrelated legacy typing debt block every worker.
files = app/core/config.py, app/core/logging_config.py, app/core/metrics.py, app/core/security.py, app/core/stream_runtime_heartbeat.py, app/core/stream_schedule.py, app/core/supervisor_control.py, app/core/systemd_control.py, app/schemas/admin.py, app/schemas/quota.py, app/middleware/security_headers.py, app/middleware/websocket_safe_csrf.py
