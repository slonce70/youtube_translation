[mypy]
python_version = 3.12
pretty = True
show_error_codes = True
warn_unused_ignores = True

# Deliberately scope the strict backend mypy gate to the release-hardening
# surfaces that are currently maintained and expected to stay green. This keeps
# RUN_MYPY=1 meaningful for mission-touched infrastructure code without letting
# unrelated legacy typing debt block every worker.
files = app/core/config.py, app/core/logging_config.py, app/core/metrics.py, app/core/observability.py, app/core/quota.py, app/core/security.py, app/core/stream_runtime_heartbeat.py, app/core/stream_schedule.py, app/core/systemd_control.py, app/core/uvicorn_config.py, app/streaming/validator.py, app/schemas/admin.py, app/schemas/api.py, app/schemas/quota.py, app/middleware/security_headers.py, app/middleware/websocket_safe_csrf.py, app/api/routes/auth.py, app/api/routes/metrics.py, app/api/routes/monitoring.py, app/api/routes/quota.py, app/api/routes/youtube.py, app/services/quota/service.py, app/services/youtube/provider_status.py, app/services/youtube/service.py
