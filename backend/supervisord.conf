[unix_http_server]
file=/app/supervisord/supervisor.sock

[supervisord]
logfile=%(here)s/supervisord/logs/supervisord.log
pidfile=%(here)s/supervisord/supervisord.pid
childlogdir=%(here)s/supervisord/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/supervisord/supervisor.sock

[include]
files = %(here)s/supervisord/programs/*.ini
