[inet_http_server]
port=0.0.0.0:9001

[supervisord]
logfile=%(here)s/supervisord/logs/supervisord.log
pidfile=%(here)s/supervisord/supervisord.pid
childlogdir=%(here)s/supervisord/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://runner:9001

[include]
files = %(here)s/supervisord/programs/*.ini
