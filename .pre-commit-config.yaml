repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff
        entry: bash -c 'cd backend && .venv/bin/python -m ruff check app/'
        language: system
        pass_filenames: false

      - id: backend-black-check
        name: backend black check
        entry: bash -c 'cd backend && .venv/bin/python -m black --check app/'
        language: system
        pass_filenames: false

      - id: backend-mypy
        name: backend mypy
        entry: bash -c 'cd backend && .venv/bin/python -m mypy --config-file mypy.ini'
        language: system
        pass_filenames: false

      - id: backend-audit
        name: backend dependency audit
        entry: bash -c 'cd backend && .venv/bin/pip-audit'
        language: system
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false

      - id: frontend-audit
        name: frontend production dependency audit
        entry: bash -c 'cd frontend && npm audit --omit=dev'
        language: system
        pass_filenames: false

default_language_version:
  python: python3.12
  node: 24.0.0

# Run pre-commit on all files: pre-commit run --all-files
