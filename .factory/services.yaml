commands:
  install: make install
  lint: RUN_BLACK=1 make lint
  typecheck: RUN_MYPY=1 make type-check
  test: make test
  build: cd frontend && npm run build
  e2e: cd frontend && PORT=3100 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 npm run test:e2e
  verify: PORT=3100 PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 RUN_BLACK=1 RUN_MYPY=1 make verify-v0

services:
  postgres:
    start: docker compose -f docker/docker-compose.yml up -d postgres
    stop: docker compose -f docker/docker-compose.yml stop postgres
    healthcheck: docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' youtube-streaming-postgres | grep -q healthy
    port: 5432
    depends_on: []

  redis:
    start: docker compose -f docker/docker-compose.yml up -d redis
    stop: docker compose -f docker/docker-compose.yml stop redis
    healthcheck: docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' youtube-streaming-redis | grep -q healthy
    port: 6379
    depends_on: []

  tusd:
    start: docker compose -f docker/docker-compose.yml up -d tusd
    stop: docker compose -f docker/docker-compose.yml stop tusd
    healthcheck: curl -sf http://localhost:1080/
    port: 1080
    depends_on: []

  runner:
    start: docker compose -f docker/docker-compose.yml up -d runner
    stop: docker compose -f docker/docker-compose.yml stop runner
    healthcheck: docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' youtube-streaming-runner | grep -q healthy
    port: 9001
    depends_on: [postgres, redis]

  backend:
    start: API_PORT=8000 ./start-backend.sh
    stop: lsof -ti tcp:8000 | xargs kill 2>/dev/null || true
    healthcheck: curl -sf http://localhost:8000/health
    port: 8000
    depends_on: [postgres, redis, tusd, runner]

  frontend:
    start: FRONTEND_PORT=3100 API_PORT=8000 ./start-frontend.sh
    stop: lsof -ti tcp:3100 | xargs kill 2>/dev/null || true
    healthcheck: curl -sf http://localhost:3100/
    port: 3100
    depends_on: [backend]
