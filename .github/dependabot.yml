version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "black"
          - "ruff"
          - "mypy"
          - "pytest*"
          - "isort"
          - "pre-commit"
      runtime-patch:
        dependency-type: production
        update-types:
          - patch
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "jest*"
          - "@testing-library/*"
          - "@types/*"
          - "typescript"
      runtime-patch:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # Hold major framework bumps for manual review.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
      include: scope

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
      include: scope

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
      include: scope
