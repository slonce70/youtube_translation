name: Trivy Image Scan

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/entrypoint.sh"
      - "backend/apply_migrations.py"
      - "backend/migrations/**"
      - "backend/app/**"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".trivyignore"
      - ".github/workflows/trivy-image.yml"
  schedule:
    # Nightly scan to catch newly-disclosed CVEs even when no PR is open.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-backend:
    name: Trivy — backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: youtube-translation-backend:trivy-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Run Trivy vulnerability scan (HIGH,CRITICAL — fixed-only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: youtube-translation-backend:trivy-${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  scan-frontend:
    name: Trivy — frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: youtube-translation-frontend:trivy-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.invalid
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
            NEXT_PUBLIC_API_URL=https://example.invalid

      - name: Run Trivy vulnerability scan (HIGH,CRITICAL — fixed-only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: youtube-translation-frontend:trivy-${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
