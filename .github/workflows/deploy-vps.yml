name: Deploy VPS

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/slonce70
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify generated docker Caddyfile is in sync
        run: |
          python3 scripts/render_caddyfile.py --variant docker --template docker/Caddyfile.template --output /tmp/docker.Caddyfile
          diff -u docker/Caddyfile /tmp/docker.Caddyfile

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/slonce70/youtube_translation-backend:${{ github.sha }}
            ghcr.io/slonce70/youtube_translation-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push tusd image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/tusd.Dockerfile
          push: true
          tags: |
            ghcr.io/slonce70/youtube_translation-tusd:${{ github.sha }}
            ghcr.io/slonce70/youtube_translation-tusd:latest
          cache-from: type=gha,scope=tusd
          cache-to: type=gha,mode=max,scope=tusd

      - name: Build and push frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            DEV_API_PROXY_TARGET=http://backend:8000
            ENABLE_API_PROXY=1
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/slonce70/youtube_translation-frontend:${{ github.sha }}
            ghcr.io/slonce70/youtube_translation-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519_vps_deploy
          chmod 600 ~/.ssh/id_ed25519_vps_deploy

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Resolve current production state
        id: prod_state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_state="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" '
            for name in youtube-streaming-backend youtube-streaming-frontend youtube-streaming-tusd; do
              docker inspect "$name" --format "{{.Name}}|{{.Config.Image}}|{{.State.StartedAt}}" 2>/dev/null || true
            done
          ')"

          matches=0
          seen=0
          while IFS='|' read -r name image started_at; do
            [[ -z "${name:-}" ]] && continue
            seen=$((seen + 1))
            if [[ "$image" == *":$TARGET_SHA" ]]; then
              matches=$((matches + 1))
            fi
          done <<< "$remote_state"

          needs_deploy=true
          if [[ "$seen" -eq 3 && "$matches" -eq 3 ]]; then
            needs_deploy=false
          fi

          {
            echo "needs_deploy=$needs_deploy"
            echo 'remote_state<<EOF'
            printf '%s\n' "$remote_state"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Production deployment state'
            echo ''
            if [[ -n "$remote_state" ]]; then
              printf '%s\n' "$remote_state" | sed 's/^/- `/; s/$/`/'
            else
              echo '- `No running containers detected for backend/frontend/tusd`'
            fi
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Needs deploy: \`$needs_deploy\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check live stream deploy safety
        id: live_guard
        if: steps.prod_state.outputs.needs_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          active_streams="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "if docker ps --format '{{.Names}}' | grep -qx 'youtube-streaming-postgres'; then docker exec youtube-streaming-postgres psql -U youtube_user -d youtube_streaming -tAc \"SELECT count(*) FROM streams WHERE status IN ('running','starting','stopping');\" | tr -d '[:space:]'; else echo 0; fi")"

          if [[ ! "$active_streams" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine active stream count: $active_streams" >&2
            exit 1
          fi

          can_deploy=true
          if (( active_streams > 0 )); then
            can_deploy=false
          fi

          {
            echo "active_streams=$active_streams"
            echo "can_deploy=$can_deploy"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Live stream deploy guard'
            echo ''
            echo "- Active streams: \`$active_streams\`"
            if [[ "$can_deploy" == 'true' ]]; then
              echo '- Result: `safe to deploy`'
            else
              echo '- Result: `deploy deferred to protect live streams`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip deploy because production already matches target
        if: steps.prod_state.outputs.needs_deploy != 'true'
        run: |
          echo 'Production already runs the target commit; nothing to do.'

      - name: Skip deploy because live stream protection is active
        if: steps.prod_state.outputs.needs_deploy == 'true' && steps.live_guard.outputs.can_deploy != 'true'
        run: |
          echo "Skipping production deploy for commit ${{ github.sha }} because ${{ steps.live_guard.outputs.active_streams }} live stream(s) are active."

      - name: Deploy current main to VPS
        if: steps.prod_state.outputs.needs_deploy == 'true' && steps.live_guard.outputs.can_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "export GITHUB_SHA='$GITHUB_SHA' REGISTRY_HOST='ghcr.io' REGISTRY_USER='$REGISTRY_USER' REGISTRY_PASSWORD='$REGISTRY_PASSWORD' BACKEND_IMAGE='ghcr.io/slonce70/youtube_translation-backend:$GITHUB_SHA' FRONTEND_IMAGE='ghcr.io/slonce70/youtube_translation-frontend:$GITHUB_SHA' TUSD_IMAGE='ghcr.io/slonce70/youtube_translation-tusd:$GITHUB_SHA'; cd '$VPS_DEPLOY_PATH' && git fetch --prune origin && git checkout main && git reset --hard origin/main && bash scripts/deploy_vps.sh"
