name: Deploy VPS

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  schedule:
    # Hourly watchdog — the job still short-circuits when needs_deploy != 'true',
    # so we avoid 288 SSH probes/day while keeping the self-heal safety net.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/slonce70
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify generated docker Caddyfile is in sync
        run: |
          python3 scripts/render_caddyfile.py --variant docker --template docker/Caddyfile.template --output /tmp/docker.Caddyfile
          diff -u docker/Caddyfile /tmp/docker.Caddyfile

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/slonce70/youtube_translation-backend:${{ github.sha }}
            ghcr.io/slonce70/youtube_translation-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push tusd image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/tusd.Dockerfile
          push: true
          tags: |
            ghcr.io/slonce70/youtube_translation-tusd:${{ github.sha }}
            ghcr.io/slonce70/youtube_translation-tusd:latest
          cache-from: type=gha,scope=tusd
          cache-to: type=gha,mode=max,scope=tusd

      - name: Build and push frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            DEV_API_PROXY_TARGET=http://backend:8000
            ENABLE_API_PROXY=1
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_DEV_BYPASS_AUTH=0
          tags: |
            ghcr.io/slonce70/youtube_translation-frontend:${{ github.sha }}
            ghcr.io/slonce70/youtube_translation-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519_vps_deploy
          chmod 600 ~/.ssh/id_ed25519_vps_deploy

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Resolve current production state
        id: prod_state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          extract_sha() {
            local image="$1"
            if [[ "$image" =~ :([0-9a-f]{40})$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo ""
            fi
          }

          remote_state="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" '
            for name in youtube-streaming-backend youtube-streaming-frontend youtube-streaming-tusd; do
              docker inspect "$name" --format "{{.Name}}|{{.Config.Image}}|{{.State.StartedAt}}" 2>/dev/null || true
            done
          ')"
          host_backend_active="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet youtube-backend; then echo true; else echo false; fi")"
          host_backend_unit_present="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "if [[ -f /etc/systemd/system/youtube-backend.service ]]; then echo true; else echo false; fi")"
          configured_stream_runtime_mode="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "git config --global --add safe.directory '$VPS_DEPLOY_PATH' >/dev/null && cd '$VPS_DEPLOY_PATH' && sed -n 's/^[[:space:]]*STREAM_RUNTIME_MODE=//p' backend/.env 2>/dev/null | head -n 1 | tr '[:upper:]' '[:lower:]'")"
          vps_checkout_sha="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "git config --global --add safe.directory '$VPS_DEPLOY_PATH' >/dev/null && cd '$VPS_DEPLOY_PATH' && git rev-parse HEAD 2>/dev/null || true")"

          current_backend_sha=''
          current_frontend_sha=''
          current_tusd_sha=''

          while IFS='|' read -r name image started_at; do
            [[ -z "${name:-}" ]] && continue
            case "$name" in
              /youtube-streaming-backend)
                current_backend_sha="$(extract_sha "$image")"
                ;;
              /youtube-streaming-frontend)
                current_frontend_sha="$(extract_sha "$image")"
                ;;
              /youtube-streaming-tusd)
                current_tusd_sha="$(extract_sha "$image")"
                ;;
            esac
          done <<< "$remote_state"

          {
            echo "current_backend_sha=$current_backend_sha"
            echo "current_frontend_sha=$current_frontend_sha"
            echo "current_tusd_sha=$current_tusd_sha"
            echo "host_backend_active=$host_backend_active"
            echo "host_backend_unit_present=$host_backend_unit_present"
            echo "configured_stream_runtime_mode=$configured_stream_runtime_mode"
            echo "vps_checkout_sha=$vps_checkout_sha"
            echo 'remote_state<<EOF'
            printf '%s\n' "$remote_state"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Production deployment state'
            echo ''
            if [[ -n "$remote_state" ]]; then
              printf '%s\n' "$remote_state" | sed 's/^/- `/; s/$/`/'
            else
              echo '- `No running containers detected for backend/frontend/tusd`'
            fi
            echo "- VPS checkout SHA: \`$vps_checkout_sha\`"
            echo "- Host-native backend active: \`$host_backend_active\`"
            echo "- Host-native backend unit present: \`$host_backend_unit_present\`"
            echo "- Configured stream runtime mode: \`${configured_stream_runtime_mode:-unset}\`"
            echo "- Target SHA: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Determine deploy impact
        id: impact
        env:
          TARGET_SHA: ${{ github.sha }}
          CURRENT_BACKEND_SHA: ${{ steps.prod_state.outputs.current_backend_sha }}
          CURRENT_FRONTEND_SHA: ${{ steps.prod_state.outputs.current_frontend_sha }}
          CURRENT_TUSD_SHA: ${{ steps.prod_state.outputs.current_tusd_sha }}
          HOST_BACKEND_ACTIVE: ${{ steps.prod_state.outputs.host_backend_active }}
          HOST_BACKEND_UNIT_PRESENT: ${{ steps.prod_state.outputs.host_backend_unit_present }}
          CONFIGURED_STREAM_RUNTIME_MODE: ${{ steps.prod_state.outputs.configured_stream_runtime_mode }}
          VPS_CHECKOUT_SHA: ${{ steps.prod_state.outputs.vps_checkout_sha }}
        run: |
          set -euo pipefail
          source scripts/deploy_workflow_helpers.sh
          impact_output="$(mktemp)"
          compute_deploy_impact > "$impact_output"
          cat "$impact_output" >> "$GITHUB_OUTPUT"

          while IFS='=' read -r key value; do
            case "$key" in
              frontend_needs_deploy|backend_needs_deploy|tusd_needs_deploy|infra_needs_deploy|host_runtime_needs_refresh|host_runtime_managed|deploy_services)
                printf -v "$key" '%s' "$value"
                ;;
            esac
          done < "$impact_output"

          {
            echo '### Deploy impact analysis'
            echo ''
            echo "- Frontend update needed: \`$frontend_needs_deploy\`"
            echo "- Backend/runner update needed: \`$backend_needs_deploy\`"
            echo "- tusd update needed: \`$tusd_needs_deploy\`"
            echo "- Infra sync needed: \`$infra_needs_deploy\`"
            echo "- Host runtime refresh needed: \`$host_runtime_needs_refresh\`"
            echo "- Host runtime managed: \`$host_runtime_managed\`"
            echo "- Host-native backend active: \`$HOST_BACKEND_ACTIVE\`"
            echo "- Host-native backend unit present: \`$HOST_BACKEND_UNIT_PRESENT\`"
            echo "- Configured stream runtime mode: \`${CONFIGURED_STREAM_RUNTIME_MODE:-unset}\`"
            echo "- Planned services: \`${deploy_services:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check live stream deploy safety
        id: live_guard
        if: steps.impact.outputs.needs_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FRONTEND_ONLY_DEPLOY: ${{ steps.impact.outputs.frontend_only_deploy }}
          HOST_RUNTIME_ONLY_REFRESH: ${{ steps.impact.outputs.host_runtime_only_refresh }}
          HOST_BACKEND_ACTIVE: ${{ steps.prod_state.outputs.host_backend_active }}
        run: |
          set -euo pipefail
          active_streams="$(ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "if docker ps --format '{{.Names}}' | grep -qx 'youtube-streaming-postgres'; then docker exec youtube-streaming-postgres psql -U youtube_user -d youtube_streaming -tAc \"SELECT count(*) FROM streams WHERE status IN ('running','starting','stopping');\" | tr -d '[:space:]'; else echo 0; fi")"

          if [[ ! "$active_streams" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine active stream count: $active_streams" >&2
            exit 1
          fi

          source scripts/deploy_workflow_helpers.sh
          decision_output="$(mktemp)"
          ACTIVE_STREAMS="$active_streams" evaluate_live_deploy_guard > "$decision_output"
          {
            echo "active_streams=$active_streams"
            cat "$decision_output"
          } >> "$GITHUB_OUTPUT"

          decision=''
          while IFS='=' read -r key value; do
            if [[ "$key" == 'decision' ]]; then
              decision="$value"
            fi
          done < "$decision_output"

          {
            echo '### Live stream deploy guard'
            echo ''
            echo "- Active streams: \`$active_streams\`"
            echo "- Decision: \`$decision\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip deploy because no runtime-relevant services changed
        if: steps.impact.outputs.needs_deploy != 'true'
        run: |
          echo 'No runtime-relevant service changes detected; nothing to deploy.'

      - name: Sync VPS checkout when only deploy metadata changed
        if: steps.impact.outputs.needs_deploy != 'true' && steps.prod_state.outputs.vps_checkout_sha != github.sha
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "git config --global --add safe.directory '$VPS_DEPLOY_PATH' >/dev/null && cd '$VPS_DEPLOY_PATH' && git fetch --prune origin && git checkout main && git reset --hard origin/main"

      - name: Skip deploy because live stream protection is active
        if: steps.impact.outputs.needs_deploy == 'true' && steps.live_guard.outputs.can_deploy != 'true'
        run: |
          echo "Skipping production deploy for commit ${{ github.sha }} because ${{ steps.live_guard.outputs.active_streams }} live stream(s) are active and the planned service set is not frontend-only."

      - name: Deploy selected services to VPS
        if: steps.impact.outputs.needs_deploy == 'true' && steps.live_guard.outputs.can_deploy == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          DEPLOY_SERVICES: ${{ steps.impact.outputs.deploy_services_csv }}
          DEPLOY_SYNC_HOST_CADDY: ${{ steps.impact.outputs.sync_host_caddy }}
          DEPLOY_SKIP_DOCKER: ${{ steps.impact.outputs.skip_docker_deploy }}
          DEPLOY_RESTART_HOST_BACKEND: ${{ steps.impact.outputs.restart_host_backend }}
          DEPLOY_INSTALL_SYSTEMD_UNITS: ${{ steps.impact.outputs.install_systemd_units }}
          DEPLOY_PREPARE_HOST_NATIVE: ${{ steps.impact.outputs.prepare_host_native }}
          DEPLOY_CUTOVER_HOST_RUNTIME: ${{ steps.impact.outputs.cutover_host_runtime }}
        run: |
          ssh -i ~/.ssh/id_ed25519_vps_deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "export GITHUB_SHA='$GITHUB_SHA' REGISTRY_HOST='ghcr.io' REGISTRY_USER='$REGISTRY_USER' REGISTRY_PASSWORD='$REGISTRY_PASSWORD' BACKEND_IMAGE='ghcr.io/slonce70/youtube_translation-backend:$GITHUB_SHA' FRONTEND_IMAGE='ghcr.io/slonce70/youtube_translation-frontend:$GITHUB_SHA' TUSD_IMAGE='ghcr.io/slonce70/youtube_translation-tusd:$GITHUB_SHA' DEPLOY_SERVICES='$DEPLOY_SERVICES' DEPLOY_SYNC_HOST_CADDY='$DEPLOY_SYNC_HOST_CADDY' DEPLOY_SKIP_DOCKER='$DEPLOY_SKIP_DOCKER' DEPLOY_RESTART_HOST_BACKEND='$DEPLOY_RESTART_HOST_BACKEND' DEPLOY_INSTALL_SYSTEMD_UNITS='$DEPLOY_INSTALL_SYSTEMD_UNITS' DEPLOY_PREPARE_HOST_NATIVE='$DEPLOY_PREPARE_HOST_NATIVE' DEPLOY_CUTOVER_HOST_RUNTIME='$DEPLOY_CUTOVER_HOST_RUNTIME'; git config --global --add safe.directory '$VPS_DEPLOY_PATH' >/dev/null && cd '$VPS_DEPLOY_PATH' && git fetch --prune origin && git checkout main && git reset --hard origin/main && bash scripts/deploy_vps.sh"
