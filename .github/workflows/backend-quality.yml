name: Backend Quality Checks

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare test environment
        run: |
          cat <<'ENV' > .env.ci
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_KEY=dummy-key
          SUPABASE_JWT_SECRET=dummy-jwt-secret
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ENCRYPTION_SALT=test_salt_value
          DOWNLOAD_TOKEN_SECRET=test_download_secret
          UPLOAD_TOKEN_SECRET=test_upload_secret
          TUSD_HMAC_SECRET=test_tusd_secret
          METRICS_ACCESS_TOKEN=test_metrics_token
          ENV

      - name: Run migrations
        env:
          ENV_FILE: .env.ci
        run: |
          export $(grep -v '^#' "$ENV_FILE" | xargs)
          python apply_migrations.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Run test suite
        env:
          ENV_FILE: .env.ci
        run: |
          export $(grep -v '^#' "$ENV_FILE" | xargs)
          pytest -v
