name: Backend Quality Checks

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate tusd hooks bash syntax
        run: |
          bash -n tusd-hooks/pre-create tusd-hooks/post-finish

      - name: Run ruff
        run: python -m ruff check app/

      - name: Prepare test environment
        run: |
          cat <<'ENV' > .env.ci
          SUPABASE_URL=https://example.supabase.co
          SUPABASE_KEY=dummy-key
          SUPABASE_JWT_SECRET=dummy-jwt-secret
          DATABASE_URL=postgresql://postgres:password@localhost:5432/postgres
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ENCRYPTION_SALT=test_salt_value
          DOWNLOAD_TOKEN_SECRET=test_download_secret
          TUSD_HMAC_SECRET=test_tusd_secret
          UPLOAD_TOKEN_SECRET=test_upload_secret
          ENV

      - name: Run unit tests
        env:
          ENV_FILE: .env.ci
        run: |
          export $(grep -v '^#' "$ENV_FILE" | xargs)
          FFMPEG_BIN=tests/bin/ffmpeg pytest -v
