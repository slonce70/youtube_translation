# Alert rules for YouTube Streaming Platform.
#
# All metric names referenced below ARE actually exported by the backend's
# /api/metrics/prometheus endpoint via app.core.metrics.AppMetrics. If you
# extend this file, verify the metric exists in metrics.py first — Sprint 4
# review caught a regression where alert rules referenced unimplemented
# metrics and silently never fired.
#
# Naming: <Surface><Symptom> — e.g. BackendDown, StreamErrorSpike.
# Severity: page = wake oncall, warning = file ticket, info = noise floor.

groups:
  - name: backend
    interval: 30s
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Backend instance is down"
          description: |
            Prometheus has been unable to scrape /api/metrics/prometheus on
            {{ $labels.instance }} for 5 minutes. /readyz is also likely
            failing. Live stream control plane is unavailable; ffmpeg
            children continue running under their per-stream systemd units
            (host-native production mode). Operator action: check journald
            for the backend service and `systemctl status youtube-backend`.

      - alert: BackendReadinessFlapping
        expr: |
          (
            sum_over_time(up{job="backend"}[15m])
              / count_over_time(up{job="backend"}[15m])
          ) < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backend readiness flapping"
          description: |
            up{{job="backend"}} dipped below 95% over 15m. Likely a DB or
            Redis dependency flap; inspect /readyz JSON breakdown.

      - alert: BackendApiErrorSpike
        # api_errors_total is a counter incremented by AppMetrics; rate over
        # 5m vs api_requests_total gives an error fraction.
        expr: |
          (
            sum(rate(api_errors_total[5m]))
              /
            (sum(rate(api_requests_total[5m])) > 0)
          ) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API error rate above 2% over 10m"
          description: |
            More than 2% of backend API requests are returning errors.
            Inspect Sentry for the dominant error class and check the
            most recent deploy.

      - alert: BackendApiLatencyHigh
        # api_latency_seconds is a histogram. p95 above 1s sustained means
        # something is blocking the event loop.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(api_latency_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency > 1s for 10m"
          description: |
            Investigate slow DB queries, blocked event loop (sync I/O on
            the request path), or upstream Supabase/MediaMTX latency.

  - name: streams
    interval: 30s
    rules:
      - alert: StreamErrorSpike
        # stream_errors_total is incremented per ffmpeg failure or quality
        # rejection. A spike means many streams are failing in a short
        # window — usually a regional YouTube ingest issue or an internal
        # config bug.
        expr: increase(stream_errors_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5 stream errors in 10m"
          description: |
            Inspect /api/admin/alerts for the affected streams. If a single
            user is responsible, contact them; if many users are affected,
            check YouTube ingest health and MediaMTX logs.

      - alert: NoActiveStreamsForExtendedPeriod
        # Useful as an early-warning that the entire platform is silently
        # broken on the streaming-ingest side. Operator can choose to
        # disable when long maintenance windows are expected.
        expr: max_over_time(active_streams[1h]) == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Zero active streams for 1h"
          description: |
            Either no users are streaming (off-peak) OR the platform is
            silently rejecting starts. Cross-check stream_starts_total
            increase rate.

  - name: storage
    interval: 1m
    rules:
      - alert: DiskFreeLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/opt/youtube_translation_data"} /
           node_filesystem_size_bytes{mountpoint="/opt/youtube_translation_data"}) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% free on /opt/youtube_translation_data"
          description: |
            Free space below 15%. Investigate uploads/ size, prune old
            stream logs, or expand the volume. Disk-full hard-fails
            stream starts and uploads.

      - alert: DiskFreeCritical
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/opt/youtube_translation_data"} /
           node_filesystem_size_bytes{mountpoint="/opt/youtube_translation_data"}) < 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Less than 5% free on /opt/youtube_translation_data — IMMINENT FAILURE"

  - name: certificates
    interval: 1h
    rules:
      - alert: CertExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS cert {{ $labels.instance }} expires in < 14 days"
          description: |
            Caddy auto-renews via ACME, but a stuck renewal will eventually
            page on this rule. Check Caddy logs and ACME provider state.
