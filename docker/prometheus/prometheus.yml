# Prometheus scrape configuration for the YouTube Streaming platform.
#
# Scrape targets:
#   - backend:        FastAPI /api/metrics/prometheus (token-gated)
#   - mediamtx:       mediamtx /metrics (Prometheus exposition; only when
#                     STREAM_RUNTIME_MODE includes mediamtx)
#   - node-exporter:  host-level disk/cpu/mem
#
# Deploy with `docker compose -f docker/prometheus/docker-compose.yml up -d`
# OR run as a systemd unit (yt-prometheus.service template not yet shipped —
# follow-up).
#
# The backend metrics token is loaded via env var BACKEND_METRICS_TOKEN —
# the operator points to a file mounted with mode 0400. The Authorization
# header is set on the per-job basis below.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: youtube-streaming
    environment: production

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: backend
    metrics_path: /api/metrics/prometheus
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
    # The backend gates /api/metrics/prometheus behind require_metrics_access.
    # Operators inject the bearer token via authorization_file (preferred over
    # password_file because the value is a JWT-like opaque string).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/backend-metrics.token

  - job_name: mediamtx
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["mediamtx:9998"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
