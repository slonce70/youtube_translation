version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: youtube-streaming-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/streams:/app/streams
      - ../backend/logs:/app/logs
    env_file:
      - ../backend/.env
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      tusd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # tusd (Resumable uploads)
  tusd:
    image: tusproject/tusd:latest
    container_name: youtube-streaming-tusd
    command: -dir /app/uploads -hooks-http http://backend:8000/api/assets/upload-complete -port 1080
    ports:
      - "1080:1080"
    volumes:
      - ../backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Caddy (Reverse proxy with auto HTTPS)
  caddy:
    image: caddy:2-alpine
    container_name: youtube-streaming-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  # Frontend (Next.js) - Optional in docker-compose
  # Can be deployed separately on Vercel
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: youtube-streaming-frontend
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env.local
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  caddy-data:
  caddy-config:

networks:
  app-network:
    driver: bridge
