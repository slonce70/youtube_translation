services:
  # Supported tranche-one topology keeps backend, tusd, runner, and uploads on the same host.
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: youtube-streaming-postgres
    environment:
      - POSTGRES_USER=youtube_user
      - POSTGRES_PASSWORD=dev_password_local_only
      - POSTGRES_DB=youtube_streaming
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_user -d youtube_streaming"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional, used for rate limiting)
  redis:
    image: redis:7-alpine
    container_name: youtube-streaming-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: youtube-streaming-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/streams:/app/streams
      - ../backend/logs:/app/logs
      - ../backend/supervisord:/app/supervisord
      - ../backend/supervisord.docker.conf:/app/supervisord.conf
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://youtube_user:dev_password_local_only@postgres:5432/youtube_streaming
      - REDIS_URL=redis://redis:6379/0
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
      - MEDIAMTX_ENABLED=true
      - MEDIAMTX_RTMP_PUBLISH_URL=rtmp://mediamtx:1935
      - MEDIAMTX_CONTROL_API_URL=http://mediamtx:9997
      - MEDIAMTX_METRICS_URL=http://mediamtx:9998/metrics
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tusd:
        condition: service_healthy
      runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # tusd (Resumable uploads)
  tusd:
    build:
      context: ..
      dockerfile: docker/tusd.Dockerfile
    container_name: youtube-streaming-tusd
    command: -port 1080 -base-path=/files/ -behind-proxy -upload-dir /app/uploads -hooks-dir /tusd-hooks -hooks-enabled-events=pre-create,post-finish -max-size=10737418240
    ports:
      - "1080:1080"
    volumes:
      - ../backend/uploads:/app/uploads
    env_file:
      - ../backend/.env
    environment:
      - TUSD_BACKEND_URL=http://backend:8000
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--max-time", "3", "http://localhost:1080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Caddy (Reverse proxy with auto HTTPS)
  caddy:
    image: caddy:2-alpine
    container_name: youtube-streaming-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      tusd:
        condition: service_healthy

  # Frontend (Next.js) - Optional in docker-compose
  # Can be deployed separately on Vercel
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        DEV_API_PROXY_TARGET: http://backend:8000
        ENABLE_API_PROXY: "1"
    container_name: youtube-streaming-frontend
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env.local
    environment:
      - DEV_API_PROXY_TARGET=http://backend:8000
      - ENABLE_API_PROXY=1
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Runner (Supervisor for FFmpeg processes)
  runner:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: youtube-streaming-runner
    entrypoint: ["/app/scripts/start-runner.sh"]
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/streams:/app/streams
      - ../backend/logs:/app/logs
      - ../backend/supervisord:/app/supervisord
      - ../backend/supervisord.docker.conf:/app/supervisord.conf
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://youtube_user:dev_password_local_only@postgres:5432/youtube_streaming
      - REDIS_URL=redis://redis:6379/0
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m supervisor.supervisorctl -c /app/supervisord.conf status >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MediaMTX (optional future media-plane relay / metrics hub)
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: youtube-streaming-mediamtx
    ports:
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:9998:9998"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks:
      - app-network

volumes:
  caddy-data:
  caddy-config:
  postgres-data:

networks:
  app-network:
    driver: bridge
