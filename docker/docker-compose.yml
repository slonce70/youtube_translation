services:
  # Supported tranche-one topology keeps backend, tusd, runner, and uploads on the same host.
  # Compose expects POSTGRES_PASSWORD to be exported in the shell (or provided via a root .env)
  # before `docker compose` runs; in production we source `backend/.env` first so the secret
  # stays out of this file.
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: youtube-streaming-postgres
    ports:
      # Keep database reachable from a host-native Linux backend control plane.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=youtube_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=youtube_streaming
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_user -d youtube_streaming"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional, used for rate limiting)
  redis:
    image: redis:7-alpine
    container_name: youtube-streaming-redis
    ports:
      # Keep Redis reachable from a host-native Linux backend control plane.
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/slonce70/youtube_translation-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: youtube-streaming-backend
    ports:
      # Active host-level Caddy on the VPS proxies to this loopback binding.
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HOST_UPLOADS_DIR:-../backend/uploads}:/app/uploads
      - ${HOST_STREAMS_DIR:-../backend/streams}:/app/streams
      - ${HOST_LOGS_DIR:-../backend/logs}:/app/logs
      - ${HOST_SUPERVISORD_DIR:-../backend/supervisord}:/app/supervisord
      - ../backend/supervisord.docker.conf:/app/supervisord.conf
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://youtube_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/youtube_streaming
      - REDIS_URL=redis://redis:6379/0
      - STREAM_RUNTIME_MODE=${STREAM_RUNTIME_MODE:-supervisor}
      - ALLOW_UNSAFE_MANAGER_RUNTIME=${ALLOW_UNSAFE_MANAGER_RUNTIME:-false}
      - ALLOW_UNSAFE_CONTAINERIZED_SYSTEMD_RUNTIME=${ALLOW_UNSAFE_CONTAINERIZED_SYSTEMD_RUNTIME:-false}
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
      - MEDIAMTX_ENABLED=true
      - MEDIAMTX_RTMP_PUBLISH_URL=rtmp://mediamtx:1935
      - MEDIAMTX_CONTROL_API_URL=http://mediamtx:9997
      - MEDIAMTX_METRICS_URL=http://mediamtx:9998/metrics
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tusd:
        condition: service_healthy
      runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # tusd (Resumable uploads)
  tusd:
    image: ${TUSD_IMAGE:-ghcr.io/slonce70/youtube_translation-tusd:latest}
    build:
      context: ..
      dockerfile: docker/tusd.Dockerfile
    container_name: youtube-streaming-tusd
    command: -port 1080 -base-path=/files/ -behind-proxy -upload-dir /app/uploads -hooks-dir /tusd-hooks -hooks-enabled-events=pre-create,post-finish -max-size=10737418240
    ports:
      # Active host-level Caddy on the VPS proxies to this loopback binding.
      - "127.0.0.1:1080:1080"
    volumes:
      - ${HOST_UPLOADS_DIR:-../backend/uploads}:/app/uploads
    env_file:
      - ../backend/.env
    environment:
      - TUSD_BACKEND_URL=${TUSD_BACKEND_URL:-http://backend:8000}
    restart: unless-stopped
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "--max-time", "3", "http://localhost:1080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Caddy (Reverse proxy with auto HTTPS)
  caddy:
    image: caddy:2-alpine
    container_name: youtube-streaming-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      tusd:
        condition: service_healthy

  # Frontend (Next.js) - Optional in docker-compose
  # Can be deployed separately on Vercel
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/slonce70/youtube_translation-frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        DEV_API_PROXY_TARGET: ${FRONTEND_API_PROXY_TARGET:-http://backend:8000}
        ENABLE_API_PROXY: "1"
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: youtube-streaming-frontend
    ports:
      # Active host-level Caddy on the VPS proxies to this loopback binding.
      - "127.0.0.1:3000:3000"
    env_file:
      - ../frontend/.env.local
    environment:
      - DEV_API_PROXY_TARGET=${FRONTEND_API_PROXY_TARGET:-http://backend:8000}
      - ENABLE_API_PROXY=1
    restart: unless-stopped
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Runner (Supervisor for FFmpeg processes)
  runner:
    image: ${BACKEND_IMAGE:-ghcr.io/slonce70/youtube_translation-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: youtube-streaming-runner
    entrypoint: ["/app/scripts/start-runner.sh"]
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ${HOST_UPLOADS_DIR:-../backend/uploads}:/app/uploads
      - ${HOST_STREAMS_DIR:-../backend/streams}:/app/streams
      - ${HOST_LOGS_DIR:-../backend/logs}:/app/logs
      - ${HOST_SUPERVISORD_DIR:-../backend/supervisord}:/app/supervisord
      - ../backend/supervisord.docker.conf:/app/supervisord.conf
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://youtube_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/youtube_streaming
      - REDIS_URL=redis://redis:6379/0
      - STREAM_RUNTIME_MODE=${STREAM_RUNTIME_MODE:-supervisor}
      - ALLOW_UNSAFE_MANAGER_RUNTIME=${ALLOW_UNSAFE_MANAGER_RUNTIME:-false}
      - ALLOW_UNSAFE_CONTAINERIZED_SYSTEMD_RUNTIME=${ALLOW_UNSAFE_CONTAINERIZED_SYSTEMD_RUNTIME:-false}
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - FFPROBE_BIN=/usr/bin/ffprobe
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m supervisor.supervisorctl -c /app/supervisord.conf status >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MediaMTX (optional future media-plane relay / metrics hub)
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: youtube-streaming-mediamtx
    ports:
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:9998:9998"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks:
      - app-network

volumes:
  caddy-data:
    name: ${CADDY_DATA_VOLUME_NAME:-youtube_translation_caddy_data}
  caddy-config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-youtube_translation_caddy_config}
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-youtube_translation_postgres_data}

networks:
  app-network:
    driver: bridge
